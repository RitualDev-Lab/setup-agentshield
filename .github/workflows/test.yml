name: Action Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-action:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Action
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Setup AgentShield Action
        uses: ./
        with:
          version: 'latest'
          air-gapped: 'true'

      - name: Validate agentshield command execution
        run: |
          agentshield --version
          agentshield --help
